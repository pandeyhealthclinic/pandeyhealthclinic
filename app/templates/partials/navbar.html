<header class="site-header">
  <nav class="navbar" id="navbar">
    <a href="{{ url_for('main.home') }}" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2C12 2 5 8.5 5 14a7 7 0 0 0 14 0c0-5.5-7-12-7-12Z" fill="currentColor"/><path d="M9 14.5c1.2 1.6 3 2 4.5 1" stroke="#0E3B32" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
      </span>
      <span class="brand-name">Pandey Health<span class="brand-dot">.</span></span>
    </a>

    <ul class="nav-links" id="navLinks">
      {% for link in nav_links %}
      <li><a href="{{ link.href }}">{{ link.label }}</a></li>
      {% endfor %}
    </ul>

    <div class="nav-actions">
      <a class="nav-location" href="#contact">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.4"/></svg>
        <span>{{ contact.address.split(',')[-2:] | join(',') if contact else 'Gaya, Bihar' }}</span>
      </a>
      {% if current_user %}
      <a href="{{ url_for('patient.notifications') }}" id="notificationBell" data-unread="{{ unread_notifications }}" class="nav-bell" aria-label="Notifications">
        🔔{% if unread_notifications %}<span class="bell-badge">{{ unread_notifications }}</span>{% endif %}
      </a>
      <a href="{{ url_for('patient.dashboard') }}" class="btn btn-dark btn-pill nav-login">Dashboard</a>
      {% else %}
      <a href="{{ url_for('auth.login') }}" class="btn btn-dark btn-pill nav-login">Log in</a>
      {% endif %}
      <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
</header>
